name: soft_ui_kit
description: Material 3 Flutter UI kit with SoftNavBar, SoftCard, theme tokens, and onboarding widgets.
version: 1.0.0
homepage: https://github.com/gpdhanush/pos_billing_app
repository: https://github.com/gpdhanush/pos_billing_app
issue_tracker: https://github.com/gpdhanush/pos_billing_app/issues
documentation: https://github.com/gpdhanush/pos_billing_app/tree/main/packages/soft_ui_kit
topics:
  - ui
  - widgets
  - navigation
  - theme
  - material-design

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Arimo
      fonts:
        - asset: fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: fonts/Arimo/Arimo-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: fonts/Arimo/Arimo-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: fonts/Arimo/Arimo-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Arimo/Arimo-Bold.ttf
          weight: 700
        - asset: fonts/Arimo/Arimo-BoldItalic.ttf
          weight: 700
          style: italic
