name: pos_billing
description: Offline-first POS billing and inventory for Android.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  mobile_scanner: ^7.1.3
  image_picker: ^1.2.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  archive: ^4.0.7
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  google_sign_in: ^6.3.0
  googleapis: ^17.0.0
  http: ^1.5.0
  uuid: ^4.5.1
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.6
  collection: ^1.19.1
  line_icons: ^2.0.3
  pdf: ^3.13.0
  share_plus: ^12.0.2
  pinput: ^6.0.2
  cached_network_image: ^4.0.0
  url_launcher: ^6.3.2
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  flutter_dotenv: ^6.0.1
  google_mobile_ads: ^9.1.0
  hugeicons: ^1.1.7
  pointycastle: ^3.9.1
  firebase_core: ^3.15.1
  firebase_analytics: ^11.5.2
  firebase_crashlytics: ^4.3.9
  firebase_messaging: ^15.2.9
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/img/
  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/Arimo-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Arimo/Arimo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Arimo/Arimo-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Arimo/Arimo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Arimo/Arimo-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Arimo/Arimo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Arimo/Arimo-BoldItalic.ttf
          weight: 700
          style: italic
